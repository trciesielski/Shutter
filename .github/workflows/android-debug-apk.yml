name: Build SHUTTER Android Auto debug APK
on:
  push:
    branches: [feature/shutter-android-auto]
    paths:
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install dependencies
        run: npm ci
      - name: Build Capacitor and phoneAuto APK
        run: |
          npm run android:sync
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assemblePhoneAutoDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: shutter-android-auto-debug-apk
          path: android/app/build/outputs/apk/phoneAuto/debug/*.apk
          if-no-files-found: error
          retention-days: 14
