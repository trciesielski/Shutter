name: Build SHUTTER Android Auto debug APK
on:
  push:
    branches: [feature/shutter-android-auto]
    paths:
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found in $ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies
        run: npm ci
      - name: Build Capacitor and phoneAuto APK
        run: |
          npm run android:sync
          cd android
          chmod +x ./gradlew
          ./gradlew :app:assemblePhoneAutoDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: shutter-android-auto-debug-apk
          path: android/app/build/outputs/apk/phoneAuto/debug/*.apk
          if-no-files-found: error
          retention-days: 14
