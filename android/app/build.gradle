apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.kapt'

def stagingMusicBaseUrl = 'https://shutter-web-6p2.pages.dev/music/'
def musicBaseOverride = gradle.startParameter.projectProperties['SHUTTER_MUSIC_BASE_URL']
        ?: System.getenv('SHUTTER_MUSIC_BASE_URL')
def catalogOverride = gradle.startParameter.projectProperties['SHUTTER_CATALOG_URL']
        ?: System.getenv('SHUTTER_CATALOG_URL')
def musicBaseUrl = (musicBaseOverride
        ?: findProperty('SHUTTER_MUSIC_BASE_URL')
        ?: stagingMusicBaseUrl).toString()
def catalogUrl = (catalogOverride
        ?: "${musicBaseUrl.replaceAll('/+$', '')}/catalog/catalog.json").toString()

android {
    namespace = "com.trciesielski.shutter"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.trciesielski.shutter"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField 'String', 'SHUTTER_MUSIC_BASE_URL', groovy.json.JsonOutput.toJson(musicBaseUrl)
        buildConfigField 'String', 'SHUTTER_CATALOG_URL', groovy.json.JsonOutput.toJson(catalogUrl)
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig true
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'shutter.musicBaseOverride', musicBaseOverride ?: ''
            systemProperty 'shutter.catalogOverride', catalogOverride ?: ''
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-datasource:$media3Version"
    implementation "androidx.room:room-runtime:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"
    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    testImplementation "androidx.test:core:$androidxTestCoreVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
